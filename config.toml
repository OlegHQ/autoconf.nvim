[editor]
scrolloff = 5
mouse = true
default-yank-register = '"'
middle-click-paste = true
scroll-lines = 10
cursorline = false
cursorcolumn = false
continue-comments = true
auto-completion = true
path-completion = true
auto-format = true
atomic-save = true
auto-info = true
bufferline = "never"
color-modes = false
completion-replace = false
completion-timeout = 250
completion-trigger-len = 2
default-line-ending = "native"
editor-config = true
end-of-line-diagnostics = "disable"
idle-timeout = 250
indent-heuristic = "hybrid"
insert-final-newline = true
jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"
popup-border = "none"
preview-completion-insert = true
text-width = 80
trim-final-newlines = false
trim-trailing-whitespace = false
true-color = false
undercurl = false

[editor.cursor-shape]
normal = "underline"
insert = "underline"
select = "underline"

[editor.statusline]
left = [
    "mode",
    "spinner",
    "file-name",
    "read-only-indicator",
    "file-modification-indicator",
]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding"]
separator = "│"
mode.normal = "NOR"
mode.insert = "INS"
mode.select = "SEL"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.lsp]
enable = true
display-messages = true
display-progress-messages = false
auto-signature-help = true
display-inlay-hints = false
display-color-swatches = true
display-signature-help-docs = true
snippets = true
goto-reference-include-declaration = true


[editor.file-picker]
hidden = true
follow-symlinks = true
deduplicate-links = true
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true

[editor.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
"'" = "'"
"\"" = "\""
"`" = "`"
"<" = ">"

[editor.auto-save]
focus-lost = false

[editor.auto-save.after-delay]
enable = false
timeout = 3000

[editor.search]
smart-case = true
wrap-around = true

[editor.whitespace]
render = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·"

[editor.indent-guides]
render = false
character = "│"
skip-levels = 0

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[editor.gutters.line-numbers]
min-width = 3

# diagnostics, diff, and spacer gutters are unused in config but listed for completeness

[editor.soft-wrap]
enable = false
max-wrap = 20
max-indent-retain = 40
wrap-indicator = "↪ "
wrap-at-text-width = false

[editor.smart-tab]
enable = true
supersede-menu = false

[editor.inline-diagnostics]
cursor-line = "disable"
other-lines = "disable"
prefix-len = 1
max-wrap = 20
max-diagnostics = 10
